# User-facing texts in English.
# Keys are the same in every language; {name} are placeholders.

[cli]
description = "Explains why your disk is filling up."

[cli.commands]
scan = "Scans a disk or a folder and saves a snapshot."
report = "Shows a report of what takes up space (not implemented yet)."
growth = "Compares two snapshots and shows what grew (not implemented yet)."

[cli.scan]
target_name = "TARGET"
target_help = "Disk (for example C:) or folder to scan."
admin_help = "Scan with administrator permissions; Windows will ask for permission. Whole disks only, like C:."

[cli.report]
target_name = "TARGET"
target_help = "Disk or folder already scanned before (for example C:); if missing, uses the latest snapshot of any of them."
top_help = "How many folders to show, largest first (20 by default)."
json_help = "Show the result as JSON instead of a table."

[format]
decimal_separator = "."
thousands_separator = ","

[scan]
done = "Scan of {target} finished in {duration}."
counts = "Folders: {folders} · Files: {files} · Links skipped: {links}"
space_volume = "Scanned: {scanned} of {used} used (volume of {total}, {free} free)."
space_folder = "Scanned: {scanned} (the volume uses {used} of {total} and has {free} free)."
duplicates = "Hard links (the same content under another name): {size}; each folder counts them in full and the disk total only once."
system_files = "System files, measured separately: {size}"
unreadable = "Paths without access: {count}"
unexplained = "Unexplained: {size} ({percent}% of used)."
unexplained_warning = "Warning: {size} could not be explained. Some folders may only be readable by an administrator: try `discoclaro scan {volume} --admin`."
unexplained_warning_admin = "Warning: even with administrator permissions {size} could not be explained. It may be file system space, such as metadata or volume copies."
saved = "Snapshot saved: no. {id} ({nodes} folders stored)."

[report]
title = "Largest folders of {target}, snapshot of {taken_at} (no. {id})."
column_path = "Folder"
column_size = "Size"
column_files = "Files"
shown = "Showing {shown} of {total} folders stored."

[admin]
announce = "Administrator permission will be requested to scan {target} in read-only mode. Windows will show its own permission window."
command = "Command Windows will receive: {command}"
writable_warning = "Notice: the folder where discoclaro is installed ({directory}) can be written to by your user. This is normal for a development install or a virtual environment; it should not happen on a protected install."

[errors]
not_fixed_disk = "Only fixed disks can be scanned and this path is not on one: {target}"
not_a_folder = "It does not exist or is not a folder: {target}"
cannot_open_database = "Could not open the discoclaro database: {target}"
admin_needs_volume = "With --admin only whole disks are scanned (for example C:), not folders: {target}"
elevation_declined = "The administrator permission for {target} was declined. Nothing was scanned."
elevation_timeout = "The administrator scan of {target} took too long and was no longer waited for; it may still be running in the background."
elevation_failed = "Could not scan with administrator permissions: {target}"
elevation_no_result = "The administrator scan of {target} did not leave a valid result."
unexpected = "An unexpected error happened in the administrator scan: {target}"
report_not_fixed_disk = "This path is not on a fixed disk, so no snapshot could be looked up for it: {target}"
report_no_snapshots = "There is no snapshot saved yet. Run `discoclaro scan <disk>` first."
report_no_snapshot_for_target = "There is no snapshot saved of {target}. Run `discoclaro scan {target}` first."
integrity_failed = "The administrator permission was not requested: what is installed does not match what is expected ({target}). Reinstall discoclaro and try again."
unsafe_data_location = "Nothing was written: {target} is a link or has more than one name, so it is not safe to write there. Check it by hand."
