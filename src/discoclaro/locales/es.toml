# Textos para el usuario en español (idioma por defecto).
# Las claves son las mismas en todos los idiomas; los {nombre} son marcadores.

[cli]
description = "Explica por qué se llena tu disco."

[cli.commands]
scan = "Escanea un disco o una carpeta y guarda una foto."
report = "Muestra un informe de lo que ocupa espacio (aún sin implementar)."
growth = "Compara dos fotos y muestra qué creció (aún sin implementar)."

[cli.scan]
target_name = "DESTINO"
target_help = "Disco (por ejemplo C:) o carpeta que se escanea."
admin_help = "Escanea con permisos de administrador; Windows pedirá permiso. Solo discos completos, como C:."
restart_help = "Ignora un punto de control anterior y empieza el escaneo de cero."

[cli.report]
target_name = "DESTINO"
target_help = "Disco o carpeta ya escaneados antes (por ejemplo C:); si falta, usa la última foto guardada de cualquiera."
top_help = "Cuántas carpetas mostrar, de mayor a menor tamaño (20 por defecto)."
json_help = "Muestra el resultado en JSON en vez de en una tabla."

[format]
decimal_separator = ","
thousands_separator = "."

[scan]
done = "Escaneo de {target} terminado en {duration}."
progress = "Escaneando… {folders} carpetas · {files} archivos · {size} · {path}"
resumed = "Se retomaron {count} carpetas de primer nivel de una pausa anterior."
paused = "Escaneo pausado. Corré `discoclaro scan {target}` para seguir donde se quedó."
counts = "Carpetas: {folders} · Archivos: {files} · Enlaces omitidos: {links}"
space_volume = "Escaneado: {scanned} de {used} usados (volumen de {total}, {free} libres)."
space_folder = "Escaneado: {scanned} (el volumen usa {used} de {total} y tiene {free} libres)."
duplicates = "Enlaces duros (el mismo contenido con otro nombre): {size}; cada carpeta los cuenta enteros y el total del disco, una sola vez."
system_files = "Archivos de sistema, medidos aparte: {size}"
unreadable = "Rutas sin acceso: {count}"
unexplained = "Sin explicar: {size} ({percent} % de lo usado)."
unexplained_warning = "Atención: no se pudo explicar {size}. Puede haber carpetas que solo un administrador puede abrir: prueba con `discoclaro scan {volume} --admin`."
unexplained_warning_admin = "Atención: aun con permisos de administrador no se pudo explicar {size}. Puede ser espacio propio del sistema de archivos, como metadatos o copias de volumen."
saved = "Foto guardada: n.º {id} ({nodes} carpetas guardadas)."

[report]
title = "Carpetas más grandes de {target}, foto del {taken_at} (n.º {id})."
column_path = "Carpeta"
column_size = "Tamaño"
column_files = "Archivos"
shown = "Se muestran {shown} de {total} carpetas guardadas."

[admin]
announce = "Se pedirá permiso de administrador para escanear {target} en modo solo lectura. Windows mostrará su propia ventana de permisos."
command = "Orden que recibirá Windows: {command}"
writable_warning = "Aviso: la carpeta donde está instalado discoclaro ({directory}) se puede escribir con tu usuario. Es normal en una instalación de desarrollo o en un entorno virtual; en una instalación protegida no debería pasar."

[errors]
not_fixed_disk = "Solo se pueden escanear discos fijos y esta ruta no está en uno: {target}"
not_a_folder = "No existe o no es una carpeta: {target}"
cannot_open_database = "No se pudo abrir la base de datos de discoclaro: {target}"
admin_needs_volume = "Con --admin solo se escanean discos completos (por ejemplo C:), no carpetas: {target}"
elevation_declined = "Se rechazó el permiso de administrador para {target}. No se escaneó nada."
elevation_timeout = "El escaneo de {target} con permisos de administrador tardó demasiado y se dejó de esperar; puede seguir corriendo en segundo plano."
elevation_failed = "No se pudo escanear con permisos de administrador: {target}"
elevation_no_result = "El escaneo de {target} con permisos de administrador no dejó un resultado válido."
unexpected = "Ocurrió un error inesperado en el escaneo con permisos de administrador: {target}"
report_not_fixed_disk = "Esta ruta no está en un disco fijo, así que no se pudo buscar una foto de ella: {target}"
report_no_snapshots = "No hay ninguna foto guardada todavía. Corre `discoclaro scan <disco>` primero."
report_no_snapshot_for_target = "No hay ninguna foto guardada de {target}. Corre `discoclaro scan {target}` primero."
integrity_failed = "No se pidió el permiso de administrador: lo instalado no coincide con lo esperado ({target}). Reinstala discoclaro y vuelve a intentarlo."
unsafe_data_location = "No se escribió nada: {target} es un enlace o tiene más de un nombre, así que no es seguro escribir ahí. Revísalo a mano."
scan_cancelled = "Escaneo cancelado por el usuario; no se guardó ninguna foto."
