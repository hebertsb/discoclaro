[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "discoclaro"
dynamic = ["version"]
description = "Explica por qué se llena tu disco: escanea, clasifica lo que ocupa espacio y detecta qué creció."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Suárez Burgos Hebert" }]
dependencies = []

[project.scripts]
discoclaro = "discoclaro.interfaces.cli:main"

[tool.hatch.version]
path = "src/discoclaro/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/discoclaro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest usa `assert` en cada prueba.
"tests/**" = ["S101"]
